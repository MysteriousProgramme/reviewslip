<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1F19" />
    <meta name="color-scheme" content="dark" />
    <title>Leave a review — Baanpong Lodge</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600&family=Trirong:ital,wght@0,300;0,400;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div class="masthead-top">
          <p class="eyebrow" id="eyebrow">Baanpong Lodge</p>
        </div>
        <h1 class="title">Thanks for staying<span class="title-dot">.</span></h1>
        <p class="lede">
          Here's a review in your words. Change anything you like, then post it.
        </p>
      </header>

      <section class="picker" aria-labelledby="picker-label">
        <p class="label" id="picker-label">What stood out?</p>
        <div class="chips" id="chips" role="group" aria-labelledby="picker-label"></div>
      </section>

      <section class="slip-wrap" aria-labelledby="slip-label">
        <p class="label label-slip" id="slip-label">Your review</p>
        <div class="slip" id="slip" aria-busy="true">
          <textarea
            id="review"
            class="review"
            rows="3"
            spellcheck="false"
            aria-labelledby="slip-label"
            placeholder="Your review will appear here."
          ></textarea>
          <div class="skeleton" id="skeleton" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </section>

      <div class="actions">
        <div class="actions-row">
          <button type="button" class="btn btn-quiet" id="regenerate">
            Regenerate
          </button>
          <button type="button" class="btn btn-quiet" id="copy">Copy</button>
        </div>
        <button type="button" class="btn btn-go" id="proceed" hidden>
          Proceed to Google
        </button>
        <button type="button" class="btn btn-go" id="proceed-ta" hidden>
          Proceed to Tripadvisor
        </button>
        <p class="hint" id="hint">Copies your review, then opens the listing.</p>
      </div>
    </main>


    <script src="/app.js"></script>
  </body>
</html>
