<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1F19" />
    <meta name="color-scheme" content="dark" />
    <!-- No business name baked in: one install serves every customer, and the
         real name arrives with /api/config a moment later. -->
    <title>Leave a review</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Redirects to this venue's pair on Google Fonts, or to the shipped pair.
         A redirect rather than a stylesheet here so one static tag can resolve
         differently per venue; the preconnects above keep the connection warm
         across it. -->
    <link href="/fonts.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- This venue's own palette, if it set one, redefining the custom
         properties the file above declares. Second, so it wins; a <link> rather
         than something applied after /api/config, so the guest never watches the
         default colours for the length of a request. Empty for a venue with no
         theme. -->
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div class="masthead-top">
          <!-- The venue's own mark, when it has uploaded one. Hidden until the
               config says there is one, so a venue without a logo never shows a
               broken image. -->
          <img class="logo" id="logo" alt="" hidden />
          <p class="eyebrow" id="eyebrow"></p>
          <!-- Which language the page and the review are both in. Options come
               from the server so the list cannot drift from what the prompt
               accepts, nor from the strings table that translates this page. -->
          <select class="lang" id="lang" aria-label="Language"></select>
        </div>
        <!-- English here, and replaced the moment /app.js runs. Markup rather
             than an empty element so a guest on a slow connection reads
             something rather than watching a blank page assemble itself; the
             dot is a separate span because it is styled, not spoken. -->
        <h1 class="title" id="title">
          <span id="heading">Thanks for stopping by</span
          ><span class="title-dot" id="title-dot">.</span>
        </h1>
        <p class="lede" id="lede">
          Here's a review in your words. Change anything you like, then post it.
        </p>
      </header>

      <section class="picker" aria-labelledby="picker-label">
        <p class="label" id="picker-label">What stood out?</p>
        <div class="chips" id="chips" role="group" aria-labelledby="picker-label"></div>
        <!-- Ten topics are shown, drawn at random. This opens the rest, and
             stays hidden when there is no rest to open. -->
        <button type="button" class="browse" id="browse" hidden></button>
      </section>

      <!-- Every topic the business has, alphabetically.
           A <dialog> rather than a div: showModal() gives the backdrop, the
           Escape key, the focus trap and the inertness of everything behind it
           for free, and all four are things a hand-rolled overlay gets wrong.
           Outside .picker so the sheet is positioned against the viewport
           rather than against a section that scrolls. -->
      <dialog class="sheet" id="topics-dialog" aria-labelledby="topics-title">
        <div class="sheet-head">
          <h2 class="sheet-title" id="topics-title">All topics</h2>
          <button type="button" class="sheet-close" id="topics-done">Done</button>
        </div>
        <div class="chips sheet-chips" id="all-chips" role="group" aria-labelledby="topics-title"></div>
      </dialog>

      <section class="picker" aria-labelledby="length-label">
        <p class="label" id="length-label">How long?</p>
        <!-- A radiogroup rather than toggles: these three are exclusive, and
             aria-pressed would announce three independent switches. -->
        <div
          class="chips"
          id="lengths"
          role="radiogroup"
          aria-labelledby="length-label"
        ></div>
      </section>

      <section class="slip-wrap" aria-labelledby="slip-label">
        <p class="label label-slip" id="slip-label">Your review</p>
        <div class="slip" id="slip" aria-busy="true">
          <textarea
            id="review"
            class="review"
            rows="3"
            spellcheck="false"
            aria-labelledby="slip-label"
            placeholder="Your review will appear here."
          ></textarea>
          <div class="skeleton" id="skeleton" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </section>

      <div class="actions">
        <div class="actions-row">
          <button type="button" class="btn btn-quiet" id="regenerate">
            Regenerate
          </button>
          <button type="button" class="btn btn-quiet" id="copy">Copy</button>
        </div>
        <!-- Built from whichever links the business has set. -->
        <div class="destinations" id="destinations"></div>
        <p class="hint" id="hint">Copies your review, then opens the listing.</p>
      </div>
    </main>


    <!-- Every string the page can say, in every language it offers. Before
         app.js and not deferred: the page's first act is to put itself into the
         guest's language, and a table that arrives afterwards would show them
         English first and then swap it. -->
    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
