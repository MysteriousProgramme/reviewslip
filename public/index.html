<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1F19" />
    <meta name="color-scheme" content="dark" />
    <!-- No business name baked in: one install serves every customer, and the
         real name arrives with /api/config a moment later. -->
    <title>Leave a review</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600&family=Trirong:ital,wght@0,300;0,400;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <!-- This venue's own palette, if it set one, redefining the custom
         properties the file above declares. Second, so it wins; a <link> rather
         than something applied after /api/config, so the guest never watches the
         default colours for the length of a request. Empty for a venue with no
         theme. -->
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div class="masthead-top">
          <p class="eyebrow" id="eyebrow"></p>
          <!-- Which language the review is written in. Options come from the
               server so the list cannot drift from what the prompt accepts. -->
          <select class="lang" id="lang" aria-label="Review language"></select>
        </div>
        <h1 class="title">Thanks for staying<span class="title-dot">.</span></h1>
        <p class="lede">
          Here's a review in your words. Change anything you like, then post it.
        </p>
      </header>

      <section class="picker" aria-labelledby="picker-label">
        <p class="label" id="picker-label">What stood out?</p>
        <div class="chips" id="chips" role="group" aria-labelledby="picker-label"></div>
        <!-- Ten topics are shown, drawn at random. This reveals the rest, and
             stays hidden when there is no rest to reveal. -->
        <button type="button" class="browse" id="browse" hidden></button>
      </section>

      <section class="picker" aria-labelledby="length-label">
        <p class="label" id="length-label">How long?</p>
        <!-- A radiogroup rather than toggles: these three are exclusive, and
             aria-pressed would announce three independent switches. -->
        <div
          class="chips"
          id="lengths"
          role="radiogroup"
          aria-labelledby="length-label"
        ></div>
      </section>

      <section class="slip-wrap" aria-labelledby="slip-label">
        <p class="label label-slip" id="slip-label">Your review</p>
        <div class="slip" id="slip" aria-busy="true">
          <textarea
            id="review"
            class="review"
            rows="3"
            spellcheck="false"
            aria-labelledby="slip-label"
            placeholder="Your review will appear here."
          ></textarea>
          <div class="skeleton" id="skeleton" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </section>

      <div class="actions">
        <div class="actions-row">
          <button type="button" class="btn btn-quiet" id="regenerate">
            Regenerate
          </button>
          <button type="button" class="btn btn-quiet" id="copy">Copy</button>
        </div>
        <!-- Built from whichever links the business has set. -->
        <div class="destinations" id="destinations"></div>
        <p class="hint" id="hint">Copies your review, then opens the listing.</p>
      </div>
    </main>


    <script src="/app.js"></script>
  </body>
</html>
